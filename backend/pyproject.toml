[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "linguistic-workbench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "stanza==1.11.0",
  "torch==2.8.0",
  "spacy>=3.8,<3.9",
  "ginza>=5.2,<6",
  "ja-ginza>=5.2,<6",
  "sudachidict-core",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
ui-test = ["playwright==1.55.0", "pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
workbench = ["migrations/*.sql"]
