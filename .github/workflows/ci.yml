name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Lightweight tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Parser libraries and model weights are deliberately not installed:
      # opt-in real-model and browser tests require a provisioned environment.
      - name: Install lightweight test dependencies
        run: |
          python -m pip install -c eval/constraints-linux-py312.txt "fastapi>=0.115,<1" "pydantic>=2.9,<3" "httpx>=0.27,<1" "pytest>=8,<10"
          python -m pip install --no-deps -e ./backend
      - name: Run backend tests
        run: python -m pytest backend/tests -q -ra
      - name: Check JavaScript and Markdown export
        run: |
          node --check frontend/app.js
          node --check frontend/history.js
          node --check frontend/questions.js
          node --check frontend/export.js
          node frontend/tests/test_export.js
